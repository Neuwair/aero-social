[build]
  base = "."
  publish = "public"

[functions]
  directory = "netlify/functions"

[dev]
  port = 8888
  publish = "public"

# Static assets will be served normally, only HTML routes get redirected
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
  Content-Security-Policy = "default-src 'self'; connect-src 'self' https://ka-f.fontawesome.com https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm/@emoji-mart/data; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://kit.fontawesome.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://ka-f.fontawesome.com https://kit.fontawesome.com; img-src 'self' data: https: blob:; font-src 'self' data: https://ka-f.fontawesome.com;"

[[headers]]
  for = "*.js"
  [headers.values]
  
[functions."scheduled-removeExpiredUsers"]
  schedule = "*/10 * * * *"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/**/*.js"
  [headers.values]
    Content-Type = "application/javascript"
